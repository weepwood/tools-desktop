name: Electron CI
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  windows-installer:
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Windows file safety and IPC regression tests
        run: npm test
      - name: Verify FFmpeg binaries
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); for(const m of ['ffmpeg-static','ffprobe-static']) { const v=require(m); const p=typeof v==='string'?v:v.path; if(!p||!fs.existsSync(p)) throw Error(m+' binary missing: '+p); console.log(m,p); }"
      - name: Real FFmpeg screenshot smoke test
        run: node --test tests/video.smoke.cjs
      - name: Real FFmpeg size-based video splitting smoke test
        run: node --test tests/split.smoke.cjs
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME must match package version $expectedTag"
          }
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged media binaries
        shell: pwsh
        run: |
          $path = "release/win-unpacked/resources/app.asar.unpacked/node_modules"
          $ffmpeg = Get-ChildItem -Path $path -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $path -Recurse -Filter ffprobe.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "Packaged FFmpeg/FFprobe files are missing" }
          Write-Output "Packaged tools: $($ffmpeg.FullName), $($ffprobe.FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: HALO-Windows
          path: release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALO-Windows
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release/*.exe)
          if [ "${#assets[@]}" -lt 2 ]; then
            echo "Expected both installer and portable executable in release/"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "HALO $GITHUB_REF_NAME" \
            --generate-notes
