name: Electron CI
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  windows-installer:
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Windows file safety and IPC regression tests
        run: npm test
      - name: Verify FFmpeg binaries
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); for(const m of ['ffmpeg-static','ffprobe-static']) { const v=require(m); const p=typeof v==='string'?v:v.path; if(!p||!fs.existsSync(p)) throw Error(m+' binary missing: '+p); console.log(m,p); }"
      - name: Real FFmpeg screenshot smoke test
        run: node --test tests/video.smoke.cjs
      - name: Real FFmpeg size-based video splitting smoke test
        run: node --test tests/split.smoke.cjs
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME must match package version $expectedTag"
          }
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged media binaries
        shell: pwsh
        run: |
          $path = "release/win-unpacked/resources/app.asar.unpacked/node_modules"
          $ffmpeg = Get-ChildItem -Path $path -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $path -Recurse -Filter ffprobe.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "Packaged FFmpeg/FFprobe files are missing" }
          Write-Output "Packaged tools: $($ffmpeg.FullName), $($ffprobe.FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: HALO-Windows
          path: release/*.exe
          if-no-files-found: error

  macos-package:
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Create macOS app icon
        shell: bash
        run: |
          mkdir -p assets/icon.iconset
          sips -z 16 16 assets/icon.png --out assets/icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/icon.png --out assets/icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/icon.png --out assets/icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/icon.png --out assets/icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/icon.png --out assets/icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/icon.png --out assets/icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/icon.png --out assets/icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/icon.png --out assets/icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/icon.png --out assets/icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 assets/icon.png --out assets/icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns assets/icon.iconset -o assets/icon.icns
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: HALO-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALO-Windows
          path: release/windows
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release -type f -print0)
          if [ "${#assets[@]}" -lt 2 ]; then
            echo "Expected Windows release packages"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "HALO $GITHUB_REF_NAME" \
            --generate-notes

  macos-release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.macos-package.result == 'success'
    needs: [release, macos-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALO-macOS
          path: release/macos
      - name: Attach macOS packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/macos/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
