name: Electron CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
  windows-installer:
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node -e "const fs=require('fs');for(const m of ['ffmpeg-static','ffprobe-static']){const v=require(m);const p=typeof v==='string'?v:v.path;if(!p||!fs.existsSync(p))throw Error(m+' binary missing: '+p);console.log(m,p)}"
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: XIMA-Tools-Windows
          path: release/*
          if-no-files-found: error
