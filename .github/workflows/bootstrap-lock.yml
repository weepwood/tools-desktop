name: Generate lockfile artifact
on:
  push:
    branches: [feat/v0.2.0-security-stability]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Provide exact lockfile blob for repository commit
        shell: bash
        run: |
          echo LOCKFILE_BLOB_BEGIN
          base64 -w 0 package-lock.json
          echo
          echo LOCKFILE_BLOB_END
      - uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
